name: armTemplateDeployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  armDeploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: Azure/Login@v1
        with:
          creds: ${{secrets.AZURE_CREDENTIALS}}  

      - name: Deploy Resource Group (Azure CLI)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az deployment sub create \
              --name create-rg-deployment \
              --location eastus2 \
              --template-file ARM-templates/resourceGroup.json \
              --parameters resourceGroupName=nQ-Resource-Group

      - name: Deploy Storage Account (ARM Action)
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: nQ-Resource-Group
          template: ARM-templates/storageaccount.json
          parameters: ARM-templates/parameters.json
          deploymentMode: Incremental
          deploymentName: nQ-Incremental-Deployment-Storage