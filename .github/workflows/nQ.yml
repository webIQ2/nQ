# This is a basic workflow to help you get started with Actions

name: armTemplateDeployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  armDeploy:
    runs-on: ubuntu-latest

 
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure Login
        uses: Azure/Login@v1
        with:
          creds:  ${{secrets.AZURE_CREDENTIALS}}  

      - name: Run Azure CLI commands
        uses: Azure/CLI@v1
        with:
          azcliversion: 2.45.0
          inlineScript: |
            az deployment sub create --resource-group nQ --template-file ARM-templates/resourceGroup.json