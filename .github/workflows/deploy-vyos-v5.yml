name: deploy-vyos-v5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy VyOS oneclick
        uses: azure/cli@v2
        env:
          AZURE_CORE_OUTPUT: none
          ADMIN_SOURCE_PREFIX: ${{ secrets.ADMIN_SOURCE_PREFIX }}
          NVA_ADMIN_PASSWORD: ${{ secrets.NVA_ADMIN_PASSWORD }}
          TEST_VM_SSH_PUBLIC_KEY: ${{ secrets.TEST_VM_SSH_PUBLIC_KEY }}
        with:
          azcliversion: latest
          inlineScript: |
            az account show --output table
            az config set bicep.use_binary_from_path=false
            az bicep install

            cd infra/webIQ_clean_hubspoke_v5/vyos/oneclick

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$TEST_VM_SSH_PUBLIC_KEY" > ~/.ssh/id_ed25519.pub
            chmod 600 ~/.ssh/id_ed25519.pub

            export SSH_KEY_FILE="$HOME/.ssh/id_ed25519.pub"
            chmod +x deploy.sh validate.sh

            ./deploy.sh
            ./validate.sh

      - name: Smoke test commercial VM
        uses: azure/cli@v2
        env:
          AZURE_CORE_OUTPUT: none
        with:
          azcliversion: latest
          inlineScript: |
            az vm run-command invoke \
              -g rg-netiq-vyos-commercial \
              -n vm-commercial-test \
              --subscription ff60f646-9751-4074-9f58-9fc310105c4c \
              --command-id RunShellScript \
              --scripts "ping -c 3 10.62.1.4; ip route; curl -I -sS https://management.azure.com; curl -I -sS https://management.usgovcloudapi.net" \
              --query "value[0].message" -o tsv

      - name: Smoke test government VM
        uses: azure/cli@v2
        env:
          AZURE_CORE_OUTPUT: none
        with:
          azcliversion: latest
          inlineScript: |
            az vm run-command invoke \
              -g rg-gi-vyos-government \
              -n vm-government-test \
              --subscription 1011dd77-657c-4c57-931b-0b77b92e7378 \
              --command-id RunShellScript \
              --scripts "ping -c 3 10.61.1.4; ip route; curl -I -sS https://management.azure.com; curl -I -sS https://management.usgovcloudapi.net" \
              --query "value[0].message" -o tsv