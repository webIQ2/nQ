name: destroy-vyos-v5

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: destroy
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Destroy VyOS v5 baseline
        working-directory: infra/webIQ_clean_hubspoke_v5/vyos/oneclick
        run: |
          chmod +x decommission.sh
          ./decommission.sh

      - name: Verify resource groups removed
        run: |
          az group exists -n rg-webiq-vyos-hub --subscription 7426560d-ace3-4e95-9df4-69985fb9d8cc
          az group exists -n rg-netiq-vyos-commercial --subscription ff60f646-9751-4074-9f58-9fc310105c4c
          az group exists -n rg-gi-vyos-government --subscription 1011dd77-657c-4c57-931b-0b77b92e7378
