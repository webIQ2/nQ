name: destroy-vyos-v5

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: destroy
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Destroy VyOS v5 baseline
        working-directory: infra/webIQ_clean_hubspoke_v5/vyos/oneclick
        run: |
          chmod +x decommission.sh
          ./decommission.sh

      - name: Verify resource groups removed
        run: |
          HUB=$(az group exists -n rg-webiq-vyos-hub --subscription 7426560d-ace3-4e95-9df4-69985fb9d8cc -o tsv)
          COM=$(az group exists -n rg-netiq-vyos-commercial --subscription ff60f646-9751-4074-9f58-9fc310105c4c -o tsv)
          GOV=$(az group exists -n rg-gi-vyos-government --subscription 1011dd77-657c-4c57-931b-0b77b92e7378 -o tsv)

          echo "Hub exists: $HUB"
          echo "Commercial exists: $COM"
          echo "Government exists: $GOV"

          test "$HUB" = "false"
          test "$COM" = "false"
          test "$GOV" = "false"