name: deploy-commercial-customer

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub environment name
        required: true
        default: Production Commercial
        type: choice
        options:
          - Lab
          - Development
          - Test
          - Staging
          - Production Commercial
      customer:
        description: Customer overlay
        required: true
        default: general-dynamics
        type: choice
        options:
          - general-dynamics
          - lockheed-martin
          - northrop-grumman

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Show overlay
        run: |
          cat overlays/${{ inputs.customer }}/parameters.json
          echo "Implement customer-specific deployment overlays here."
