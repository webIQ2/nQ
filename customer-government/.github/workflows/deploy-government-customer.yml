name: deploy-government-customer

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub environment name
        required: true
        default: Production Government
        type: choice
        options:
          - Lab
          - Development
          - Test
          - Staging
          - Production Government
      customer:
        description: Customer overlay
        required: true
        default: gi
        type: choice
        options:
          - gi
          - dod

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Show overlay
        run: |
          cat overlays/${{ inputs.customer }}/parameters.json
          echo "Implement government-specific deployment overlays here."
